spring.application.name=ocm-healthcare-api
server.port=${SERVER_PORT:8080}

spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:ocm_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.open-in-view=false
spring.jackson.serialization.write-dates-as-timestamps=false

ocm.security.jwt.secret=${OCM_JWT_SECRET:change-this-development-secret-at-least-32-chars}
ocm.security.jwt.expiration-ms=${OCM_JWT_EXPIRATION_MS:3600000}
ocm.bootstrap.admin-password=${OCM_BOOTSTRAP_ADMIN_PASSWORD:Admin@12345}
ocm.bootstrap.care-manager-password=${OCM_BOOTSTRAP_CARE_MANAGER_PASSWORD:Care@12345}
ocm.bootstrap.viewer-password=${OCM_BOOTSTRAP_VIEWER_PASSWORD:Viewer@12345}
ocm.kafka.enabled=${OCM_KAFKA_ENABLED:false}
ocm.kafka.topics.member-events=${OCM_MEMBER_EVENTS_TOPIC:ocm.member-events}
ocm.kafka.topics.care-plan-events=${OCM_CARE_PLAN_EVENTS_TOPIC:ocm.care-plan-events}
ocm.kafka.topics.claim-events=${OCM_CLAIM_EVENTS_TOPIC:ocm.claim-events}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
management.endpoints.web.exposure.include=health,info
